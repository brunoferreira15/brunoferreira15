name: Gerar Pac-Man das contribuições

on:
  schedule:
    - cron: '0 3 * * *' # todo dia, meia-noite no horário de Brasília
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gerar o SVG do Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Deixar o Pac-Man em preto e branco (tema do perfil)
        run: |
          for f in dist/*.svg; do
            sed -i -e 's/#0d1117/#000000/gI' -e 's/#161b22/#161616/gI' \
                   -e 's/#0e4429/#3a3a3a/gI' -e 's/#006d32/#666666/gI' \
                   -e 's/#26a641/#999999/gI' -e 's/#39d353/#dddddd/gI' "$f"
            sed -i '0,/<svg\([^>]*\)>/s//<svg\1><style>image{filter:grayscale(1)}<\/style>/' "$f"
          done

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
