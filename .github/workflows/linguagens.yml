name: Atualizar card de linguagens

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 (horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions
  push:
    branches: [main]
    paths:
      - linguagens.py
      - .github/workflows/linguagens.yml

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar linguagens.svg
        run: python3 linguagens.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linguagens.svg
          git diff --cached --quiet || (git commit -m "Atualiza card de linguagens" && git push)
